<html class="staticrypt-html">

        <meta charset="utf-8" />
        <title>Relatório Confidencial — Álvaro Marcolino</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Sem fonte de CDN. Ate 17/08/2026 esta tela puxava Inter do fonts.googleapis,
             o que entregava ao Google o IP e o referer de quem abria um documento
             confidencial, antes mesmo de a senha ser digitada, e violava o invariante
             self-contained de .claude/rules/apresentacoes.md. Embutir Inter em base64
             custaria ~500 KB em cada documento para uma tela de seis palavras; a pilha
             de sistema abaixo resolve com zero byte e zero requisicao externa. -->
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body {
                height: 100%;
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                background: #070A11;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            .staticrypt-content {
                height: 100%;
                min-height: 100vh;
                background:
                    radial-gradient(ellipse at 20% 60%, rgba(232, 123, 30, 0.07) 0%, transparent 55%),
                    radial-gradient(ellipse at 75% 20%, rgba(22, 40, 71, 0.5) 0%, transparent 50%),
                    #070A11;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .staticrypt-page {
                width: 100%;
                max-width: 480px;
            }
            .staticrypt-form {
                background: rgba(255, 255, 255, 0.04);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 16px;
                padding: 40px 36px 36px;
                box-shadow:
                    0 32px 64px rgba(0, 0, 0, 0.5),
                    0 0 0 1px rgba(232, 123, 30, 0.6) inset;
                text-align: center;
            }
            .marca-logo {
                display: block;
                margin: 0 auto 28px;
                height: 110px;
                width: auto;
                opacity: 0.95;
            }
            .staticrypt-hr {
                border: none;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                margin: 20px 0 24px;
            }
            .staticrypt-instructions { margin-bottom: 0; }
            .staticrypt-title {
                font-size: 15px;
                font-weight: 600;
                color: rgba(255, 255, 255, 0.9);
                letter-spacing: 0.02em;
                margin-bottom: 6px;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                font-size: 13px;
                color: rgba(255, 255, 255, 0.4);
                line-height: 1.5;
            }
            .staticrypt-password-container {
                position: relative;
                background: rgba(14, 27, 51, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 8px;
                margin: 0 0 12px;
                transition: border-color 0.2s;
            }
            .staticrypt-password-container:focus-within {
                border-color: rgba(232, 123, 30, 0.6);
                box-shadow: 0 0 0 3px rgba(232, 123, 30, 0.08);
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                outline: 0;
                width: 100%;
                padding: 14px 44px 14px 16px;
                font-size: 14px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                color: rgba(255, 255, 255, 0.9);
                letter-spacing: 0.01em;
            }
            .staticrypt-form input::placeholder {
                color: rgba(255, 255, 255, 0.28);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.35;
                padding: 0;
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                transition: opacity 0.2s;
                filter: invert(1);
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.65; }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 0 0 14px;
                font-size: 12px;
                color: rgba(255, 255, 255, 0.4);
                cursor: pointer;
                text-align: left;
            }
            .staticrypt-remember input[type="checkbox"] {
                accent-color: #C7CEDB;
                width: 15px;
                height: 15px;
                flex-shrink: 0;
            }
            .staticrypt-form .staticrypt-decrypt-button {
                display: block;
                width: 100%;
                padding: 14px 20px;
                background: #C7CEDB;
                border: none;
                border-radius: 8px;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                cursor: pointer;
                transition: filter 0.2s, transform 0.1s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(1.1); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: scale(0.985); filter: brightness(0.95); }
            .marca-footer {
                margin-top: 20px;
                font-size: 11px;
                color: rgba(255, 255, 255, 0.18);
                letter-spacing: 0.03em;
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #070A11;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 3px solid rgba(232, 123, 30, 0.25);
                border-top-color: #C7CEDB;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }
            @media (max-width: 480px) {
                .staticrypt-form { padding: 32px 24px 28px; border-radius: 12px; }
            }
        </style>
    </head>

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // staticrypt_pwd malformado no endereco (achado do Strix, vuln-0002, 10/11/2026): o
            // HexEncoder lancava "Invalid hexString" e a pagina ficava presa no spinner. Erro ou
            // chave errada no endereco tiram o parametro e tentam de novo, o que ainda deixa o
            // "lembrar neste dispositivo" abrir; se nada abrir, cai na tela de senha.
            async function abrirSozinho() {
                try {
                    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                    return isSuccessful === true || !!(isSuccessful && isSuccessful.isSuccessful === true);
                } catch (erro) {
                    console.warn("staticrypt: chave do endereco ou do aparelho invalida", erro);
                    return false;
                }
            }
            function tirarSenhaDoEndereco() {
                const q = new URLSearchParams(location.search),
                    h = location.hash.substring(1);
                if (!q.has("staticrypt_pwd") && !/(^|&)staticrypt_pwd=/.test(h)) return false;
                q.delete("staticrypt_pwd");
                q.delete("remember_me");
                const resto = h.split("&").filter(function (p) {
                    return p && p.indexOf("staticrypt_pwd=") !== 0 && p !== "remember_me";
                }).join("&");
                const busca = q.toString();
                history.replaceState(null, "", location.pathname + (busca ? "?" + busca : "") + (resto ? "#" + resto : ""));
                return true;
            }

            window.onload = async function () {
                let isSuccessful = await abrirSozinho();
                if (!isSuccessful && tirarSenhaDoEndereco()) {
                    isSuccessful = await abrirSozinho();
                }
                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }
                }
            };

            const imgSrcEyeOpened = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";
            toggleIcon.addEventListener("click", function () {

                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;

                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // Trava de reentrada: duplo clique em rede lenta decifrava e escrevia a pagina duas
            // vezes e o segundo document.write redeclarava as const do painel (04/11/2026).
            // Destrava so quando a senha esta errada; em senha certa a pagina e substituida.
            let decifrando = false;
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                if (decifrando) return;
                decifrando = true;
                const campo = document.getElementById("staticrypt-password"),
                    botao = document.querySelector(".staticrypt-decrypt-button");
                const password = campo.value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;
                botao.disabled = true;
                campo.readOnly = true;
                let isSuccessful = false;
                try {
                    ({ isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked));
                } finally {
                    if (!isSuccessful) {
                        decifrando = false;
                        botao.disabled = false;
                        campo.readOnly = false;
                    }
                }
                if (!isSuccessful) {
                    alert(templateError);
                }
            });
