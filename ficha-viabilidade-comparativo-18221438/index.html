<html class="staticrypt-html">

        <meta charset="utf-8" />
        <title>Relatório Confidencial — Álvaro Marcolino</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Sem fonte de CDN. Ate 17/08/2026 esta tela puxava Inter do fonts.googleapis,
             o que entregava ao Google o IP e o referer de quem abria um documento
             confidencial, antes mesmo de a senha ser digitada, e violava o invariante
             self-contained de .claude/rules/apresentacoes.md. Embutir Inter em base64
             custaria ~500 KB em cada documento para uma tela de seis palavras; a pilha
             de sistema abaixo resolve com zero byte e zero requisicao externa. -->
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body {
                height: 100%;
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                background: #070A11;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            .staticrypt-content {
                height: 100%;
                min-height: 100vh;
                background:
                    radial-gradient(ellipse at 20% 60%, rgba(232, 123, 30, 0.07) 0%, transparent 55%),
                    radial-gradient(ellipse at 75% 20%, rgba(22, 40, 71, 0.5) 0%, transparent 50%),
                    #070A11;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .staticrypt-page {
                width: 100%;
                max-width: 480px;
            }
            .staticrypt-form {
                background: rgba(255, 255, 255, 0.04);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 16px;
                padding: 40px 36px 36px;
                box-shadow:
                    0 32px 64px rgba(0, 0, 0, 0.5),
                    0 0 0 1px rgba(232, 123, 30, 0.6) inset;
                text-align: center;
            }
            .marca-logo {
                display: block;
                margin: 0 auto 28px;
                height: 110px;
                width: auto;
                opacity: 0.95;
            }
            .staticrypt-hr {
                border: none;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                margin: 20px 0 24px;
            }
            .staticrypt-instructions { margin-bottom: 0; }
            .staticrypt-title {
                font-size: 15px;
                font-weight: 600;
                color: rgba(255, 255, 255, 0.9);
                letter-spacing: 0.02em;
                margin-bottom: 6px;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                font-size: 13px;
                color: rgba(255, 255, 255, 0.4);
                line-height: 1.5;
            }
            .staticrypt-password-container {
                position: relative;
                background: rgba(14, 27, 51, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 8px;
                margin: 0 0 12px;
                transition: border-color 0.2s;
            }
            .staticrypt-password-container:focus-within {
                border-color: rgba(232, 123, 30, 0.6);
                box-shadow: 0 0 0 3px rgba(232, 123, 30, 0.08);
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                outline: 0;
                width: 100%;
                padding: 14px 44px 14px 16px;
                font-size: 14px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                color: rgba(255, 255, 255, 0.9);
                letter-spacing: 0.01em;
            }
            .staticrypt-form input::placeholder {
                color: rgba(255, 255, 255, 0.28);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.35;
                padding: 0;
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                transition: opacity 0.2s;
                filter: invert(1);
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.65; }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 0 0 14px;
                font-size: 12px;
                color: rgba(255, 255, 255, 0.4);
                cursor: pointer;
                text-align: left;
            }
            .staticrypt-remember input[type="checkbox"] {
                accent-color: #C7CEDB;
                width: 15px;
                height: 15px;
                flex-shrink: 0;
            }
            .staticrypt-form .staticrypt-decrypt-button {
                display: block;
                width: 100%;
                padding: 14px 20px;
                background: #C7CEDB;
                border: none;
                border-radius: 8px;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                cursor: pointer;
                transition: filter 0.2s, transform 0.1s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(1.1); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: scale(0.985); filter: brightness(0.95); }
            .marca-footer {
                margin-top: 20px;
                font-size: 11px;
                color: rgba(255, 255, 255, 0.18);
                letter-spacing: 0.03em;
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #070A11;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 3px solid rgba(232, 123, 30, 0.25);
                border-top-color: #C7CEDB;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }
            @media (max-width: 480px) {
                .staticrypt-form { padding: 32px 24px 28px; border-radius: 12px; }
            }
        </style>
    </head>

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    </body>
</html>
